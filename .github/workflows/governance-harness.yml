# Required tools and repository hygiene checks. Development record gates are retired.
name: governance-harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on the same PR carry no information; cancel them.
# Manual dispatches are never cancelled.
concurrency:
  group: governance-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    # Selected tool behaviour tests alone take about 14.5 min on hosted
    # runners when a routing change selects the software_workflow suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: change selection, conflict-marker and run-record
          # leak checks diff against the PR base. blob:none keeps every commit and
          # tree while skipping historical blob download.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Select tool checks
        id: selection
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/run_affected_tests.py --all --dry-run
          else
            python3 tools/run_affected_tests.py --base "$CHECKS_BASE" --dry-run
          fi
      - name: Install harness dependencies
        # pyproject.toml declares the tool dependencies: pyyaml for the
        # validators and deliverables check; the ci extra adds pytest,
        # pytest-xdist, ruff and numpy (tools/retrieval imports it, so those
        # tests stay gated here rather than skipping).
        run: python3 -m pip install --quiet ".[ci]"
      - name: Python lint (pyflakes rules)
        run: ruff check .
      - name: Deliverable dependency structure
        if: steps.selection.outputs.deliverables == 'true'
        run: python3 -m tools.deliverables --project . check
      - name: Configure canonical Ubuntu package sources
        if: steps.selection.outputs.has_tests == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          test -n "${VERSION_CODENAME}"
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

      # apt-get update dominated this step (~20s). The zsh packages are cached
      # per Ubuntu release and installed with dpkg; a miss or a dpkg failure
      # falls back to the canonical-source apt install. actions/cache never
      # re-saves an exact key hit, so bump -v1 if a cached pair goes bad.
      # Filling the cache is best-effort and can never fail the job.
      - name: Resolve Ubuntu release
        if: steps.selection.outputs.has_tests == 'true'
        id: ubuntu
        run: echo "codename=$(. /etc/os-release && echo "${VERSION_CODENAME}")" >> "${GITHUB_OUTPUT}"
      - name: Restore cached zsh packages
        if: steps.selection.outputs.has_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/zsh-debs
          key: zsh-debs-${{ runner.arch }}-${{ steps.ubuntu.outputs.codename }}-v1
      - name: Install zsh (write_status.sh guard is a zsh script)
        if: steps.selection.outputs.has_tests == 'true'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          command -v zsh >/dev/null && exit 0
          if compgen -G "${HOME}/zsh-debs/*.deb" >/dev/null \
            && sudo dpkg -i "${HOME}"/zsh-debs/*.deb >/dev/null; then
            zsh --version
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh
          rm -rf "${HOME}/zsh-debs" && mkdir -p "${HOME}/zsh-debs"
          (cd "${HOME}/zsh-debs" && apt-get download zsh zsh-common) || rm -rf "${HOME}/zsh-debs"
      - name: Consumed role and workflow package contracts
        if: steps.selection.outputs.instructions == 'true'
        run: |
          python3 tools/validation/validate_agent_instructions.py --json
          python3 tools/validation/validate_workflow_metadata.py --json
      - name: Unresolved conflict markers
        env:
          CONFLICT_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git rev-parse --verify --quiet "${CONFLICT_BASE_REF}^{commit}" >/dev/null; then
            CONFLICT_BASE_REF=HEAD^
          fi
          python3 tools/validation/validate_conflict_markers.py --base "${CONFLICT_BASE_REF}" --head HEAD
      # D-GOV-45: run records are history and are not otherwise tested; only
      # the run records this change adds or modifies are scanned, for
      # credentials (BLOCK) and oversized evidence (WARN). The repo is public.
      - name: Run-record leak check (D-GOV-45; BLOCK fails the run)
        env:
          LEAK_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git rev-parse --verify --quiet "${LEAK_BASE_REF}^{commit}" >/dev/null; then
            LEAK_BASE_REF=HEAD^
          fi
          python3 tools/validation/validate_run_record_leaks.py --base "${LEAK_BASE_REF}" --head HEAD
      - name: Selected tool behavior tests
        if: steps.selection.outputs.has_tests == 'true'
        env:
          CHECKS_BASE: ${{ github.event.pull_request.base.sha }}
          CHIRALITY_REQUIRE_LIVE_TESTS: "1"
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 tools/run_affected_tests.py --all
          else
            python3 tools/run_affected_tests.py --base "$CHECKS_BASE"
          fi

  harness:
    name: harness
    needs: [repository-checks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected verification to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit(f"Verification did not succeed: {failed}")
          print('Shared-library repository checks passed.')
          PYTHON
