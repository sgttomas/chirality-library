id: DEL-01-01
name: A usable route into the selected library
needs:
  - from: DEL-04-02
    condition: "`execution/_Decomposition/_LATEST_ACCEPTED.md` names the accepted decomposition, and that decomposition gives each allocated deliverable its numeric identity, goal and boundary."
    when: The entry links to the accepted decomposition or names a deliverable by its identity
  - from: DEL-04-01
    condition: Each of the seven localities DEL-04-01 forms holds a ScopeOfWork.md stating its local goal, accepted scope and objective references, outputs, boundaries, acceptance criteria and verification, and a deliverable.yaml carrying its id, name, needs and code and check pointers.
    when: The route sends a maintainer to a deliverable's scope and needs
  - from: DEL-03-01
    condition: "`tools/deliverables/README.md` and `tools/workflow_runtime/README.md` state each command's invocation, prerequisites, outputs, effects and limits, and the commands behave as those guides say. The query guide names Python 3, PyYAML, Git and a resolvable HEAD as prerequisites and direct reading of declarations as the fallback."
    when: The route shows a structured query or the workflow resolver, or says what one returns
  - from: unknown
    condition: "`python3 tools/validation/build_workflow_index.py` generates `workflows/index.json` from each workflow package's canonical metadata, validates `workflows/catalog.yaml` against the packages present, and with `--check` fails when the committed index is stale. Which deliverable provides this tool is not established."
    when: A workflow package's metadata changes, or the workflow index is checked against its owning source
  - from: DEL-02-01
    condition: The maintenance guidance states that a change to the entry is reviewed under the text that preceded it, that both the changed holding and the means used to change it are verified, that the preceding text stays usable and recoverable until the replacement is verified and adopted by someone with authority to adopt it, and that proposed text does not authorise itself or redefine the basis of its own review.
    when: The entry is revised
  - from: DEL-05-01
    condition: README.md and the consumer guides state how a reader selects a published edition or a development revision and how material is obtained and copied with its resources and licence notices, at a place the entry can link to.
    when: The entry tells a reader which basis they are viewing, or sends a consumer to obtaining and update guidance
  - from: DEL-05-01
    condition: "`docs/alignment-manual/README.md` gives, for each edition a reader may have selected, its source file or the documented route to recover it."
    when: The route leads to a publication edition, or a claim relies on a publication's exact content
  - from: DEL-02-02
    condition: The affected thesis and manual passages state the meaning that applies to their audience and use, or name the earlier basis of the edition they retain, so that the route can point to the passage instead of settling the meaning.
    when: The route leads to a passage whose shared meaning is disputed
code_paths:
  - init-prompt.md
  # Shared with DEL-02-01 and DEL-04-01. Here: the opening identity, the table of where work happens,
  # the development entry's opening and "Locate the selected work", the pointers to the role file and
  # method index, and the index-regeneration rule.
  - AGENTS.md
  - CLAUDE.md
  # Shared with DEL-05-01. Here: the opening identity, the table that offers holdings by purpose and
  # the contributor section. Version choice, obtaining, copying, updates and the licence statement
  # are DEL-05-01's.
  - README.md
  # Shared with DEL-05-01. Here: how a method is selected, loaded and identified, and how the catalog
  # and index relate to package metadata. Package copying and private-archive citations are DEL-05-01's.
  - workflows/README.md
  - workflows/catalog.yaml
  - workflows/index.json
  # Shared with DEL-05-01. Here: what each publication is for, its standing, and discovery link versus
  # relied-on edition. "Read and render" and edition recovery are DEL-05-01's.
  - docs/alignment-manual/README.md
  - docs/thesis/README.md
  - docs/human-team-courses/README.md
checks:
  - tools/validation/build_workflow_index.py
