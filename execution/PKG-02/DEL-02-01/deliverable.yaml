id: DEL-02-01
name: Carry and recover an authorized holding change
needs:
- from: DEL-04-01
  condition: The bounded-reconciliation method, reached from the working cycle in AGENTS.md, compares a
    concrete result and its verification with the holdings, scopes, needs and pointers it affects, separates
    missing behaviour, stale description and missing evidence, and has the warranted edits made in the
    pull request that carries the change.
  when: The maintenance guidance sends a maintainer to diagnose, assess connected change or reconcile
    before integration
- from: DEL-03-01
  condition: tools/deliverables/README.md and the tool policy and command statements in workflows/scope-of-work/
    state, for every command they show, the invocation, inputs, dependencies, outputs, write effects,
    failure behaviour and limits, and each command does what is stated.
  when: The maintenance guidance directs a deliverables query or a scope tool
- from: unknown
  condition: tools/validation/build_workflow_index.py regenerates workflows/index.json from workflow package
    metadata and, with --check, fails on a stale index or on a missing or escaping package file;
    tools/validation/validate_workflow_metadata.py checks a package's folder name, description, optional
    execution.json and index freshness. Which deliverable provides these two tools is not established.
  when: create-workflow directs registering or checking a bundled workflow package
- from: DEL-02-02
  condition: For the compatibility-format reference that the scope-of-work and scope-change methods cite,
    the text lets a reader tell which clauses are reusable definitions, which bind only a project that
    adopted them and which are history.
  when: A method in the maintenance guidance cites a shared reference as governing
- from: DEL-05-01
  condition: README.md gives the consumer guidance for choosing a version and obtaining material and the
    update-inspection procedure, and each edition proposed to the owner has a publication candidate with
    its change account against the prior edition.
  when: The maintenance guidance sends a maintainer to prepare a publication or inspect updates
code_paths:
- AGENTS.md
- agents/**
- workflows/create-workflow/**
- workflows/scope-change/**
- workflows/scope-of-work/**
- docs/document-metadata.md
- docs/document-metadata.schema.json
checks:
- tools/validation/validate_workflow_metadata.py
- tools/validation/build_workflow_index.py
