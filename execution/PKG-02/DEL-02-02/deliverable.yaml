id: DEL-02-02
name: Make library and adopted-product meanings explicit
needs:
- from: external:sgttomas/chirality
  condition: The runtime-interface, product-boundary and compatibility-format references, which are no
    longer Library holdings, remain readable with their opening qualifications in the Git history of the
    private repository, at a revision that can be named.
  when: Reading or citing a reference passage of the applicability case
- from: DEL-01-01
  condition: docs/alignment-manual/README.md presents Consolidated v9 as a retained historical manual with
    its source paths, and separates following a discovery link from citing an exact edition and revision.
  when: Comparing or changing a manual passage
- from: DEL-05-01
  condition: The "Read and render" passage of docs/alignment-manual/README.md gives the command that
    regenerates an edition's HTML from its Markdown, and docs/alignment-manual/render_manual.py renders
    an identified committed Markdown source and, with --check, fails when the committed HTML differs
    from a fresh render.
  when: Regenerating or checking the manual's HTML after a passage changes
- from: DEL-04-01
  condition: The bounded-reconciliation method compares a concrete result and its verification with the
    holdings, scopes and needs it affects, separates missing behaviour, stale description and missing
    evidence, and has the warranted edits made in the pull request that carries the change.
  when: Carrying a reference or publication change to integration
- from: DEL-03-01
  condition: Contract validation reports whether a ScopeOfWork.md meets the current contract format and
    requires no lifecycle file or legacy document kit in a current locality; the format resolver treats
    missing, partial or invalid input as invalid and unauthorised dual content as ambiguous; and each
    usage contract states what its command does and what it does not enforce.
  when: A passage states how a tool behaves or what it enforces
- from: DEL-05-01
  condition: Compatibility with a named consumer is qualified against that consumer's own reader, contract
    or fixtures at a stated consumer revision and stated Library bytes.
  when: Changing a clause a consumer adopted in a way incompatible with its use
code_paths:
- docs/thesis/04_architecture.md
- docs/alignment-manual/Project_Management_for_Human_Agent_Teams_Consolidated_v9.*
checks:
- docs/alignment-manual/render_manual.py
