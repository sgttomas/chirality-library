id: DEL-04-02
name: Reflective review of the practice
needs:
- from: DEL-04-01
  condition: The bounded-reconciliation method takes an ordinary disagreement between a result and a scope or
    need under the commitments as they stand, corrects it in the pull request carrying the change, and brings
    a changed commitment to its owner.
  when: A reflection finds that the matter is a disagreement under current commitments, not a question about them
- from: DEL-04-01
  condition: Each of the seven localities DEL-04-01 forms has a ScopeOfWork.md stating its local goal, outputs,
    boundaries and acceptance criteria and a deliverable.yaml declaring its needs.
  when: Reading the local goal and input conditions a reflective question concerns
- from: DEL-04-01
  condition: One actual authorised change on accepted and set-up scope is identified with its goal, input or
    use condition, finding, changed route or understanding and examined neighbouring uses.
  when: Supplying the reflective side of PRD A3
- from: DEL-02-01
  condition: The create-workflow method governs creating or revising a reusable workflow, and a replacement of
    a role or method is reviewed under the text that preceded it while that text stays recoverable.
  when: Revising reflect-on-work or a reflective passage, or sending a method change that a reflection warrants
- from: DEL-01-01
  condition: README.md links to the manual index, and the manual index presents Chirality in Practice as
    material for reflection, with its edition and source paths, separate from execution instructions and
    the historical manuals.
  when: A reader reaches the book from the Library entry
- from: DEL-02-02
  condition: The account of the shared-reference repair, with its draft interpretation, the counterexample found
    in independent review and the repair, is available at the source the book cites for that case.
  when: The book presents the shared-reference repair as a case
- from: DEL-02-01
  condition: The account of the maintenance change that gave reflection its own method, with its review under
    the preceding text, is available at the source the book cites for that case.
  when: The book presents the revision of the reflective guidance as a case
- from: DEL-05-01
  condition: The account of obtaining the Library, its readers, the archive and change inspection is available
    at the source the book cites for that case.
  when: The book presents the Library's publication and consumer use as a case
- from: doc:docs/thesis/CHIRALITY_FRAMEWORK.md
  condition: The thesis keeps, at the files and anchors the book links, its account of knowing, judgment and
    the limits of representations, the mutually corrective perspectives and the contribution of the chirality
    metaphor in chapter 3, its discussion in chapter 9, and the dated source basis for App and SWBPIPE
    experience in its README.
  when: The book cites the thesis as its conceptual grounding
- from: unknown
  condition: The renderer `docs/alignment-manual/render_manual.py` produces a self-contained HTML edition from
    an identified committed Markdown source and, with `--check`, fails when the existing HTML differs.
  when: Generating or checking the book's HTML
code_paths:
- docs/alignment-manual/Chirality_in_Practice_Edition_1.*
- agents/AGENT_HELP_HUMAN.md
- workflows/coordinated-knowledge-work/WORKFLOW.md
- workflows/reflect-on-work/**
- execution/_Decomposition/**
checks:
- tools/scope_of_work/validate_scope_of_work.py
