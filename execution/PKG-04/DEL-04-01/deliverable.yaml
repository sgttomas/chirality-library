id: DEL-04-01
name: Library reconciliation
needs:
- from: DEL-04-02
  condition: The accepted decomposition gives each allocated deliverable its goal, scope items, objectives,
    anticipated outputs, evaluation and boundary, and `execution/_Decomposition/_LATEST_ACCEPTED.md` identifies
    which decomposition is accepted.
  when: Forming a locality, or reading a scope against the card it must satisfy
- from: DEL-04-02
  condition: The reflect-on-work method takes a finding that questions a purpose, a commitment or the chosen
    practice and yields a reasoned choice to retain or change it, or a reserved choice returned to the owner
    with its consequence.
  when: A reconciliation finding questions the goal or framing rather than a description
- from: DEL-03-01
  condition: Current preparation creates the numeric `execution/PKG-nn/DEL-nn-nn/` locality with its
    `deliverable.yaml` identity, preserves existing content, and writes no blank contract; the setup and
    scope-of-work usage instructions agree with those tools on inputs, outputs and limits.
  when: Forming a locality for a newly allocated deliverable
- from: DEL-03-01
  condition: The scope validator reports whether a ScopeOfWork.md meets the SOW_V1 contract, the authored-locality
    check requires matching identity, and the deliverables `check`, `neighborhood`, `impact` and `touches`
    queries derive from live `deliverable.yaml` declarations and report their basis, unknowns and partial
    coverage.
  when: Checking localities and needs together, or tracing the uses a change affects
- from: DEL-02-01
  condition: The create-workflow method governs creating or revising a reusable workflow, and a replacement is
    reviewed under the text that preceded it while that text stays recoverable.
  when: Revising the reconciliation method or one of its invocation points
- from: DEL-02-02
  condition: The shared-reference comparison is carried with the bounded-reconciliation method in the pull
    request that makes the change, and in that pull request and its sources at least one consequential
    distinction can be followed from its source warrant to the reading that changed or was kept, with the
    neighbouring claims it touches.
  when: Examining the reconciliation method in an actual application under AC-002 and AC-005
- from: doc:workflows/dependency-extract/WORKFLOW.md
  condition: The need-authoring method has the consumer author each need after its scope exists, state the
    input, use condition, trigger and source or unresolved binding in the provider's terms, and test the
    condition against the provider's scope.
  when: Authoring or examining the needs of a locality
code_paths:
- workflows/bounded-reconciliation/**
# Shared with DEL-01-01 and DEL-02-01. Here: the working cycle's reconciliation rule and the pointer
# to the reconciliation method.
- AGENTS.md
- workflows/project-setup/WORKFLOW.md
- workflows/project-setup/resources/project-entry.md
# Shared with DEL-03-01. Here: the reconciliation steps. The statements of the preparation, checking
# and query commands are DEL-03-01's.
- workflows/project-setup/resources/current-project.md
- workflows/project-setup/resources/package-activation.md
# Shared with DEL-04-02. Here: the step before integration at which the combined result is checked.
# The passages on testing a premise, diagnosing waiting and when to finish are DEL-04-02's.
- workflows/coordinated-knowledge-work/WORKFLOW.md
checks:
- tools/validation/check_min_viable_fileset.sh
- tools/scope_of_work/validate_scope_of_work.py
- tools/deliverables/cli.py
