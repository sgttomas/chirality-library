id: DEL-03-01
name: Support current localities with actual reusable tools
needs:
- from: DEL-04-01
  condition: Each of the seven localities DEL-04-01 forms holds a ScopeOfWork.md that passes the scope
    validator and the authored-locality check and a deliverable.yaml carrying its id, name, needs and
    code and check pointers.
  when: Examining the structural checks, contract validation and the queries against the Library's own
    localities
- from: DEL-02-01
  condition: The scope-of-work method states the parts a contract has and their order, and the columns of
    its output and evaluation matrix.
  when: Changing what contract validation accepts or rejects
- from: DEL-01-01
  condition: workflows/catalog.yaml declares the workflow catalog's schema and the Library's identity in it,
    a source and a source root id.
  when: The resolver resolves a workflow or a source-qualified method
- from: doc:agents/registry.json
  condition: agents/registry.json declares each role the Library offers with its instruction file and tools,
    and a workflow package's execution.json names the roles that may select it.
  when: The resolver decides whether a role may select a method
- from: DEL-02-01
  condition: The create-workflow method governs creating or revising a reusable workflow, and a replacement is
    reviewed under the text that preceded it while that text stays recoverable.
  when: Revising a usage contract that lives in a workflow package or in the preparation skill
- from: DEL-05-01
  condition: Compatibility of a Library interface with a named consumer is tested against that consumer's
    maintained contract or fixtures at a stated revision.
  when: Changing incompatibly the declaration format, the query JSON or the resolver result
code_paths:
- .github/workflows/governance-harness.yml
- tools/run_affected_tests.py
- tools/tools-test-routing.json
- tools/software_workflow/**
- tools/validation/validate_agent_instructions.py
- tools/validation/test_document_metadata.py
- tools/scaffolding/current_locality.py
- tools/scaffolding/scaffold_package.sh
- tools/scaffolding/scaffold_deliverable.sh
- tools/scaffolding/test_current_locality.py
- tools/scaffolding/test_scaffold.py
- tools/scope_of_work/**
- tools/deliverables/**
# In tools/workflow_runtime/ the reader fixture fixtures/app_workflow_reader.rs is DEL-05-01's.
- tools/workflow_runtime/README.md
- tools/workflow_runtime/resolve_workflow.py
- tools/workflow_runtime/normalize_brief.py
- tools/workflow_runtime/test_resolve_workflow.py
- tools/workflow_runtime/test_normalize_brief.py
- tools/workflow_runtime/fixtures/method_normalization_cases.json
- tools/validation/check_min_viable_fileset.sh
# Shared with DEL-04-01. Here: the statements of the preparation, checking and query commands and of
# what they create and require. The reconciliation steps are DEL-04-01's.
- workflows/project-setup/resources/current-project.md
- .agents/skills/preparation/**
# Shared with DEL-02-01. Here: the tool policy and the statements of what each tool does. The method
# of authoring a scope is DEL-02-01's.
- workflows/scope-of-work/**
- workflows/dependency-extract/resources/tools.md
checks:
- tools/software_workflow/test_tools_test_routing.py
- tools/software_workflow/test_hosted_ci_workflows.py
- tools/scaffolding/test_current_locality.py
- tools/scope_of_work/test_scope_of_work_tools.py
