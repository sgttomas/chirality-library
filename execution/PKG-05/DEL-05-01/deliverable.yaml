id: DEL-05-01
name: Obtain, qualify and inspect identified library material
needs:
- from: DEL-01-01
  condition: Each holding that the README's "Choose what you need" table and the entry route lead to states,
    at its own home, its purpose, applicability, standing, required resources and notices, outputs and limits.
  when: A consumer selects the material to obtain or copy
- from: DEL-02-01
  condition: A change carried through the maintenance route is integrated at an identified checked revision,
    with its findings and checks in its pull request.
  when: Taking an integrated revision as the verified source of a publication candidate
- from: DEL-02-01
  condition: The maintenance route establishes, before a holding is relocated or retired, its replacement or
    historical standing and a recoverable source.
  when: Documenting the recovery route of a removed holding or an earlier edition
- from: DEL-02-01
  condition: '`docs/document-metadata.md` defines the optional `metadata.upstream` object, with `source` and
    `edition` both required when it is present, and the document-metadata schema accepts it.'
  when: The comparison method records the published edition a derivation was reconciled against
- from: DEL-02-02
  condition: For the shared-reference case it repairs, each affected reference row and publication passage
    says what is reusable Library meaning, what is the Library's own practice and what a consumer adopted
    or history retains, or names the earlier basis of the edition it keeps.
  when: The consumer guidance or a change account says what does and does not transfer with copied material
- from: DEL-03-01
  condition: '`tools/deliverables/README.md` and `tools/workflow_runtime/README.md` state each command''s
    invocation, dependencies, outputs, write effects, failure behaviour and limits, including the queries''
    Git, HEAD and PyYAML requirements and that the resolver launches no agent and enforces no sandbox; the
    tools they describe need no companion and no undisclosed private or sibling input.'
  when: The consumer guidance points a reader to a tool
- from: DEL-03-01
  condition: The credential scan `tools/validation/validate_run_record_leaks.py` reads the files added or
    modified between a base and a head from Git, exits 1 on a credential pattern or escaping link and 2
    when a revision cannot be read, and runs in CI on every pull request.
  when: Screening public guidance, a publication candidate or published evidence
- from: DEL-03-01
  condition: A supported path or coordinated adapter exists for the affected interface, with its usage
    instructions.
  when: An incompatible change to an interface that a named consumer uses is selected
- from: DEL-03-02
  condition: The former repository-change evaluator and its paired workflow are identified at the public
    revision from which they can be recovered.
  when: Documenting the recovery route of a holding that an earlier edition shipped and the current source
    does not
- from: DEL-04-01
  condition: A change carried under the reconciliation method leaves its pull request as the change record,
    identifying its candidate and checks, with the guidance and publications that describe a changed
    holding agreeing with it or naming their earlier basis.
  when: Assembling an edition's change account from the changes integrated since the prior edition
- from: DEL-04-01
  condition: '`workflows/project-setup/resources/project-entry.md` is the single Library source from which
    a project''s entry documents are adapted.'
  when: The comparison method maps an adapted entry document to its Library source
- from: external:chirality-app
  condition: At revision 366e7a6656d807142e7bdeda0ccf99c37d7227b1 the workflow-package reader
    (`workflow_workspace.rs::Snapshot` and `workflow_declaration.rs`) captures a package directory read-only,
    keeps each file's bytes, yields a content identity under `chirality.app.workflow-package.sha256/v1`
    that depends on content and not location, and reads declaration standing, as that project's
    workflow-declaration and workspace-and-registration contracts define; a complete source export at
    that revision builds its library test target with the dependencies it locks.
  when: Examining or repeating the named compatibility claim
- from: external:sgttomas/chirality
  condition: The private repository keeps the tag `archive/pre-library-execution-2026-10-31` at commit
    f80f1510fb50799764720303b86c36da64b75d19, its recovery note `projects/FROZEN.md`, the holdings removed
    in this repository's migration in its history at or before 05d96f3e11, the objects that original
    consumer pins name, and the releases of the editions published before `library-v2.0.0`.
  when: Following or verifying a recovery route into pre-migration history
code_paths:
- README.md
- LICENSE.md
- workflows/README.md
- docs/alignment-manual/README.md
- docs/alignment-manual/render_manual.py
- docs/alignment-manual/requirements.txt
- workflows/compare-library-derivations/**
- tools/workflow_runtime/fixtures/app_workflow_reader.rs
checks:
- tools/validation/validate_run_record_leaks.py
- tools/publication/test_render_manual_metadata.py
